# Perfil `test`, e nao `application.properties`: arquivo de mesmo nome em
# test/resources SUBSTITUI o de main no classpath, e a suite passava a medir a
# propria configuracao em vez da de producao. Como perfil, o de producao
# carrega de base e este so sobrescreve o que a suite precisa.
# Espelha producao: mesma migracao, mesmo validate.
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
# O schema que ja existe (criado por ddl-auto ate a spec 11) E a versao 1:
# marcar baseline em 0 faria o Flyway tentar aplicar a V1 por cima de tabelas
# existentes. Banco vazio nao sofre baseline e recebe a V1 normalmente.
spring.flyway.baseline-version=1
spring.flyway.baseline-description=schema criado por ddl-auto ate a spec 11
spring.jpa.show-sql=false
jwt.secret=33YAIuZ5P9QDy3rysBBLAEFglXNLsAHQ
attus.bootstrap.internal.email=
attus.bootstrap.internal.password=

# Contagem de consultas: e o que separa um criterio de performance de um desejo.
spring.jpa.properties.hibernate.generate_statistics=true
spring.data.web.pageable.max-page-size=50

# Nenhum teste depende de rede: os provedores reais ficam desligados e quem
# responde e o duble que cada suite injeta.
attus.cep.viacep.habilitada=false
attus.cep.brasilapi.habilitada=false

# A suite roda com o que producao exige: sem estes valores a aplicacao nao sobe,
# e e isso que os criterios da spec 40 medem.
jwt.secret=33YAIuZ5P9QDy3rysBBLAEFglXNLsAHQ
attus.imagens.bucket=attus-imoveis-teste
attus.cors.origens=http://localhost:3000
