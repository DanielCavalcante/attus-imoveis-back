spring.application.name=attus-imoveis-api
spring.threads.virtual.enabled=true
spring.datasource.url=jdbc:postgresql://localhost:5433/imoveis-challenge-db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# O schema pertence a db/migration. "validate" derruba a subida quando entidade
# e schema divergem -- e o alarme que faltava, e e barato.
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
# O banco de desenvolvimento ja tem as tabelas criadas por ddl-auto: sem
# baseline o Flyway recusaria migrar um schema nao vazio. Em banco novo nao tem efeito.
spring.flyway.baseline-on-migrate=true
# O schema que ja existe (criado por ddl-auto ate a spec 11) E a versao 1:
# marcar baseline em 0 faria o Flyway tentar aplicar a V1 por cima de tabelas
# existentes. Banco vazio nao sofre baseline e recebe a V1 normalmente.
spring.flyway.baseline-version=1
spring.flyway.baseline-description=schema criado por ddl-auto ate a spec 11
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Chave só de exemplo
jwt.secret=33YAIuZ5P9QDy3rysBBLAEFglXNLsAHQ
attus.quota.pf.ativos=3

# Paginar sem limitar o tamanho nao protege nada: ?size=1000000 volta a carregar
# a tabela. O Spring reduz ao teto em silencio, em vez de recusar -- quem pede
# demais recebe o maximo, nao um erro.
spring.data.web.pageable.max-page-size=50

# ---- imagens do anuncio (spec 32) ----
# As imagens vivem num bucket do Cloud Storage. O disco do conteiner morre com
# ele e nao serve a mais de uma instancia da API.
attus.imagens.bucket=${ATTUS_IMAGENS_BUCKET:attus-imoveis-dev}
# Endereco do emulador em desenvolvimento. Vazio significa Cloud Storage de
# verdade, com a credencial padrao do ambiente (ADC) -- nenhuma chave de
# servico entra no repositorio.
attus.imagens.emulador=${ATTUS_IMAGENS_EMULADOR:}
attus.imagens.tamanho-maximo=5MB

# O teto do multipart tem de acompanhar o da aplicacao, senao o Spring recusa
# antes com uma mensagem que nao fala de imagem.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
