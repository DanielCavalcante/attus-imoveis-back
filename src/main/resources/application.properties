spring.application.name=attus-imoveis-api
spring.threads.virtual.enabled=true
# Sem valor embutido: ausencia derruba a subida em vez de tentar `localhost`,
# que em producao seria o proprio conteiner.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# O schema pertence a db/migration. "validate" derruba a subida quando entidade
# e schema divergem -- e o alarme que faltava, e e barato.
spring.jpa.hibernate.ddl-auto=validate

spring.flyway.enabled=true
# O banco de desenvolvimento ja tem as tabelas criadas por ddl-auto: sem
# baseline o Flyway recusaria migrar um schema nao vazio. Em banco novo nao tem efeito.
spring.flyway.baseline-on-migrate=true
# O schema que ja existe (criado por ddl-auto ate a spec 11) E a versao 1:
# marcar baseline em 0 faria o Flyway tentar aplicar a V1 por cima de tabelas
# existentes. Banco vazio nao sofre baseline e recebe a V1 normalmente.
spring.flyway.baseline-version=1
spring.flyway.baseline-description=schema criado por ddl-auto ate a spec 11
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Sem padrao, e de proposito: a chave que estava aqui e publica -- quem a le
# no Git forja qualquer sessao. Padrao que sobrevive ao deploy nao avisa, ele
# funciona, e o defeito so aparece quando alguem percebe.
jwt.secret=${JWT_SECRET}
attus.quota.pf.ativos=3

# Paginar sem limitar o tamanho nao protege nada: ?size=1000000 volta a carregar
# a tabela. O Spring reduz ao teto em silencio, em vez de recusar -- quem pede
# demais recebe o maximo, nao um erro.
spring.data.web.pageable.max-page-size=50

# ---- imagens do anuncio (spec 32) ----
# As imagens vivem num bucket do Cloud Storage. O disco do conteiner morre com
# ele e nao serve a mais de uma instancia da API.
attus.imagens.bucket=${ATTUS_IMAGENS_BUCKET}
# Endereco do emulador em desenvolvimento. Vazio significa Cloud Storage de
# verdade, com a credencial padrao do ambiente (ADC) -- nenhuma chave de
# servico entra no repositorio.
attus.imagens.emulador=${ATTUS_IMAGENS_EMULADOR:}
attus.imagens.tamanho-maximo=5MB

# O teto do multipart tem de acompanhar o da aplicacao, senao o Spring recusa
# antes com uma mensagem que nao fala de imagem.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# A porta vem do ambiente: Cloud Run informa `PORT` e espera que o processo a
# escute.
server.port=${PORT:8080}

# As origens que o CORS aceita. Vazio recusa todas -- e nunca vira `*`, que
# num servico com token no navegador e o contrario do que "sem configuracao"
# deveria significar. Em producao o site fala com a API pela propria origem
# (spec 42), entao esta lista existe para o desenvolvimento.
attus.cors.origens=${ATTUS_CORS_ORIGENS:}

# Saude e prontidao, e mais nada: os demais endpoints do actuator ficam
# desligados, e `health` nao mostra detalhe para quem nao esta autenticado.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
